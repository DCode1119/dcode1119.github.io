<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="CINEV pipeline diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbfd"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7fafb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5b8e9d"/>
    </marker>
    <style>
      .title { font: 700 22px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #1f2d33; }
      .label { font: 600 16px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #284047; }
      .sub { font: 12px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #60737a; }
      .box { fill: url(#box); stroke: #bcd0d8; stroke-width: 2; rx: 18; }
      .group { fill: none; stroke: #d7e3e8; stroke-width: 2; rx: 22; stroke-dasharray: 6 6; }
      .arrow { stroke: #5b8e9d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .accent { fill: #d8edf4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="480" rx="24" fill="url(#bg)"/>

  <text x="60" y="40" class="title">CINEV Studio Pipeline</text>

  <rect x="40" y="58" width="1120" height="132" class="group"/>
  <text x="60" y="84" class="label">영상 생성 파이프라인</text>
  <text x="60" y="106" class="sub">프롬프트에서 장면 정의를 만들고 Unreal Engine에서 3D Scene과 렌더링까지 진행</text>

  <rect x="90" y="126" width="190" height="48" class="box"/>
  <rect x="350" y="126" width="190" height="48" class="box"/>
  <rect x="610" y="126" width="190" height="48" class="box"/>
  <rect x="870" y="126" width="190" height="48" class="box"/>

  <text x="185" y="156" text-anchor="middle" class="label">사용자 프롬프트</text>
  <text x="445" y="156" text-anchor="middle" class="label">LLM 장면 정의</text>
  <text x="705" y="156" text-anchor="middle" class="label">3D Scene 생성</text>
  <text x="965" y="156" text-anchor="middle" class="label">렌더링 / 전달</text>

  <path d="M280 150 L340 150" class="arrow"/>
  <path d="M540 150 L600 150" class="arrow"/>
  <path d="M800 150 L860 150" class="arrow"/>

  <rect x="40" y="228" width="1120" height="184" class="group"/>
  <text x="60" y="240" class="label">이후 편집 파이프라인</text>
  <text x="60" y="264" class="sub">생성 결과에서 Streaming 환경과 Web backend로 분기한 뒤, 다시 재생성으로 합쳐진다</text>

  <rect x="70" y="322" width="180" height="44" class="box"/>
  <text x="160" y="349" text-anchor="middle" class="label">생성된 결과물</text>

  <circle cx="300" cy="344" r="10" fill="#5b8e9d"/>
  <path d="M250 344 L290 344" class="arrow"/>
  <path d="M300 344 L300 282 L420 282" class="arrow"/>
  <path d="M300 344 L300 406 L420 406" class="arrow"/>

  <rect x="420" y="260" width="220" height="44" class="box"/>
  <text x="530" y="287" text-anchor="middle" class="label">Streaming 환경</text>
  <text x="530" y="304" text-anchor="middle" class="sub">실시간 확인 / 수정</text>

  <rect x="420" y="384" width="220" height="44" class="box"/>
  <text x="530" y="411" text-anchor="middle" class="label">Web backend</text>
  <text x="530" y="428" text-anchor="middle" class="sub">Prompt 재입력</text>

  <rect x="850" y="320" width="190" height="48" class="box"/>
  <text x="945" y="349" text-anchor="middle" class="label">재생성</text>

  <path d="M640 282 L840 344" class="arrow"/>
  <path d="M640 406 L840 344" class="arrow"/>
</svg>
