<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="CINEV pipeline diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbfd"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7fafb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5b8e9d"/>
    </marker>
    <style>
      .title { font: 700 22px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #1f2d33; }
      .label { font: 600 16px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #284047; }
      .sub { font: 12px 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #60737a; }
      .box { fill: url(#box); stroke: #bcd0d8; stroke-width: 2; rx: 18; }
      .group { fill: none; stroke: #d7e3e8; stroke-width: 2; rx: 22; stroke-dasharray: 6 6; }
      .arrow { stroke: #5b8e9d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="460" rx="24" fill="url(#bg)"/>
  <text x="60" y="40" class="title">CINEV Studio Pipeline</text>

  <rect x="40" y="58" width="1120" height="124" class="group"/>
  <text x="60" y="84" class="label">영상 생성 파이프라인</text>
  <text x="60" y="106" class="sub">프롬프트에서 장면 정의를 만들고 Unreal Engine에서 3D Scene과 렌더링까지 진행</text>

  <rect x="90" y="126" width="190" height="48" class="box"/>
  <rect x="350" y="126" width="190" height="48" class="box"/>
  <rect x="610" y="126" width="190" height="48" class="box"/>
  <rect x="870" y="126" width="190" height="48" class="box"/>

  <text x="185" y="156" text-anchor="middle" class="label">사용자 프롬프트</text>
  <text x="445" y="156" text-anchor="middle" class="label">LLM 장면 정의</text>
  <text x="705" y="156" text-anchor="middle" class="label">3D Scene 생성</text>
  <text x="965" y="156" text-anchor="middle" class="label">렌더링 / 전달</text>

  <path d="M280 150 L340 150" class="arrow"/>
  <path d="M540 150 L600 150" class="arrow"/>
  <path d="M800 150 L860 150" class="arrow"/>

  <rect x="40" y="208" width="1120" height="206" class="group"/>
  <text x="60" y="234" class="label">이후 편집 파이프라인</text>
  <text x="60" y="256" class="sub">생성 결과에서 Streaming 환경과 Web backend로 분기한 뒤, 다시 재생성으로 합쳐진다</text>

  <rect x="90" y="300" width="170" height="44" class="box"/>
  <text x="175" y="327" text-anchor="middle" class="label">생성된 결과물</text>

  <rect x="350" y="252" width="210" height="44" class="box"/>
  <text x="455" y="279" text-anchor="middle" class="label">Streaming 환경</text>
  <text x="455" y="296" text-anchor="middle" class="sub">실시간 확인 / 수정</text>

  <rect x="350" y="344" width="210" height="44" class="box"/>
  <text x="455" y="371" text-anchor="middle" class="label">Web backend</text>
  <text x="455" y="388" text-anchor="middle" class="sub">Prompt 재입력</text>

  <rect x="860" y="298" width="190" height="48" class="box"/>
  <text x="955" y="327" text-anchor="middle" class="label">재생성</text>

  <path d="M260 322 L340 274" class="arrow"/>
  <path d="M260 322 L340 366" class="arrow"/>
  <path d="M560 274 L852 322" class="arrow"/>
  <path d="M560 366 L852 322" class="arrow"/>
</svg>
